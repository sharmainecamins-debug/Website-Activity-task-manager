<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My To-Do List</title>
  
  <style>
    /* ===== Global ===== */
body {
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg, #667eea, #764ba2);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

/* ===== Container ===== */
.container {
  background: white;
  padding: 25px;
  border-radius: 12px;
  width: 350px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

h1 {
  text-align: center;
  margin-bottom: 20px;
}

/* ===== Input Section ===== */
.input-section {
  display: flex;
  gap: 10px;
}

input {
  flex: 1;
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 14px;
}

button {
  padding: 10px 15px;
  border: none;
  background: #667eea;
  color: white;
  border-radius: 6px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #5563c1;
}

/* ===== Task List ===== */
ul {
  list-style: none;
  padding: 0;
  margin-top: 20px;
}

li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #f4f4f4;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 6px;
}

/* Completed task */
.completed span {
  text-decoration: line-through;
  color: gray;
}

/* Task buttons */
.task-actions {
  display: flex;
  gap: 5px;
}

.complete-btn {
  background: #28a745;
}

.delete-btn {
  background: #dc3545;
}

.complete-btn:hover {
  background: #218838;
}

.delete-btn:hover {
  background: #c82333;
}
  </style>
  
</head>
<body>

<div class="container">
  <h1>📝 My To-Do List</h1>

  <!-- Input Section -->
  <div class="input-section">
    <input type="text" id="taskInput" placeholder="Add a new task..." />
    <button id="addTaskBtn">Add</button>
  </div>

  <!-- Task List -->
  <ul id="taskList"></ul>
</div>

<script src="script.js"></script>
</body>
</html>
